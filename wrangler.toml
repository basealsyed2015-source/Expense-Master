name = "tamweel-calc"
main = "src/index.tsx"
compatibility_date = "2024-12-14"
compatibility_flags = ["nodejs_compat"]

[build]
command = ""

[[d1_databases]]
binding = "DB"
database_name = "tamweel-production-v2"
database_id = "67526746-97fb-4914-aa8f-d3cc73a6ab87"
# Apply pending migrations to Cloudflare (not just local): wrangler d1 migrations apply tamweel-production-v2 --remote

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "tamweel-calc-r2"

# Company chat DO: deployed via wrangler.chat-do.toml; Pages binds in wrangler.jsonc (script_name).
# Do not add durable_objects here — wrangler pages deploy uses wrangler.jsonc, not this file.
#
# Cron: Cloudflare Pages does NOT run [triggers].crons. Production schedule lives on the
# companion Worker: wrangler.cron.toml (`npx wrangler deploy -c wrangler.cron.toml`).
# Keep crons empty here so an accidental `wrangler deploy` of this legacy Worker config
# does not re-attach a stale cron to `tamweel-calc`.

# Forgot-password emails use Resend (https://resend.com).
# This repo deploys as Cloudflare Pages — use Pages secrets, not Workers secrets:
#   wrangler pages secret put RESEND_API_KEY --project-name <your-pages-project>
# Optional: add plain-text var EMAIL_FROM, e.g. "Tamweel <noreply@your-verified-domain.com>"
# (default without EMAIL_FROM is Resend's onboarding@resend.dev — limited to testing)
# Cron companion also needs:
#   wrangler pages secret put CRON_SECRET --project-name tamweel-calc-prod

[triggers]
crons = []

