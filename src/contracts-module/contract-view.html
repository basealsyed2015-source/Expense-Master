<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض العقد | شركة الموعد للمقاولات العامة</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== ACTIONS BAR ===== */
    .contract-actions-bar {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px 22px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: var(--shadow); margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .contract-actions-bar .btn { min-width: 120px; justify-content: center; }
    .status-change-wrap { margin-right: auto; display: flex; align-items: center; gap: 10px; }
    .status-display-wrap { display: flex; align-items: center; gap: 8px; }
    .status-display-wrap .status-label { font-size: 13px; color: var(--text-muted); }

    /* ===== A4 PREVIEW STAGE (stacked sheets) ===== */
    .contract-a4-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 24px 12px 32px;
      background: #e8eaee;
      border-radius: 10px;
      overflow-x: auto;
    }
    /* Screen-only enlarge (~125%). Applied after pagination so page breaks stay correct. */
    .contract-a4-stage.a4-preview-scaled {
      zoom: 1.25;
    }
    @supports not (zoom: 1.25) {
      .contract-a4-stage.a4-preview-scaled {
        transform: scale(1.25);
        transform-origin: top center;
      }
    }

    /* ===== CONTRACT DOCUMENT — A4 sheet ===== */
    .contract-doc,
    .a4-sheet {
      background: #fff;
      width: 210mm;
      max-width: 210mm;
      height: 297mm;
      min-height: 297mm;
      max-height: 297mm;
      margin: 0 auto;
      padding: 18mm 16mm;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
      font-size: var(--doc-body-font-size, 12px);
      line-height: 1.6;
      color: #000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.14);
      border: 1px solid #cfd5de;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .a4-sheet.has-letterhead {
      padding: 0;
    }
    .a4-sheet + .a4-sheet {
      /* visual page gap already from stage gap */
    }
    /* Landscape A4: 297mm × 210mm (rotated) */
    .a4-sheet--landscape {
      width: 297mm;
      max-width: 297mm;
      height: 210mm;
      min-height: 210mm;
      max-height: 210mm;
    }
    .a4-sheet-inner {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
    }
    .a4-sheet.has-letterhead .a4-sheet-inner {
      padding: 6mm 16mm;
    }
    .a4-letterhead-header,
    .a4-letterhead-footer {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 100%;
      line-height: 0;
      max-height: 80mm;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .a4-letterhead-footer {
      margin-top: auto; /* pin to bottom of the A4 sheet */
    }
    .a4-sheet--portrait-half .a4-letterhead-footer {
      margin-top: 0; /* follow inner content instead of pinning to bottom */
    }
    .a4-letterhead-header img,
    .a4-letterhead-footer img {
      width: 100%;
      max-height: 80mm;
      height: auto;
      display: block;
      object-fit: contain;
      object-position: center top;
      opacity: var(--doc-letterhead-opacity, 1);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .a4-letterhead-footer img {
      object-position: center bottom;
    }
    .a4-sheet-bg-watermark {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .a4-sheet-bg-watermark img {
      max-width: 62%;
      max-height: 62%;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: var(--doc-wm-opacity, 0.12);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .a4-page-label {
      position: absolute;
      left: 10px;
      bottom: 8px;
      font-size: 10px;
      color: #99a3b0;
      font-family: 'Tajawal', sans-serif;
      pointer-events: none;
      z-index: 4;
      user-select: none;
    }
    .doc-a4-line {
      margin: 0;
      padding: 0;
      text-align: justify;
      min-height: 1em;
    }
    /* Kill default <p> margins from TinyMCE / browser so paragraphs sit tight */
    .doc-document-body p,
    .doc-document-body .doc-a4-line,
    .contract-doc-body > .doc-a4-line {
      margin-top: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
    }
    .tpl-sig-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 28px;
      width: 100%;
      margin: 12px 0 6px;
      /* Do not use page-break-before here — break is only after signatures (tpl-page-break). */
    }
    .tpl-sig-col {
      flex: 1 1 0;
      text-align: center;
      min-width: 0;
    }
    .tpl-sig-col .tpl-sig-label {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tpl-sig-col .tpl-sig-name {
      margin-bottom: 2px;
      line-height: 1.35;
    }
    .tpl-sig-field {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 6px 0 4px;
      width: 100%;
    }
    .tpl-sig-field-lbl {
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tpl-sig-col .tpl-sig-space {
      flex: 1 1 auto;
      min-width: 72px;
      max-width: 150px;
      height: 52px;
      margin: 0;
      border-bottom: 1px solid #bbb;
      position: relative;
    }
    .tpl-sig-col .tpl-sig-space.tpl-sig-space--stamp {
      border-bottom: none;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tpl-sig-col .tpl-stamp-img {
      max-height: 64px;
      max-width: 110px;
      object-fit: contain;
      display: block;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .tpl-page-break {
      display: none; /* marker only — paginator starts a new A4 sheet after signatures */
      height: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }
    .a4-sheet--portrait-half .a4-sheet-inner {
      flex: 0 0 auto;
      min-height: 0;
    }
    /* Watermarks on half-page sheets must span only the top half of the sheet
       (matches the reduced bordered area). Applies to both the company logo bg
       watermark and the draft diagonal. Inline JS refines to the inner's exact
       rect; this CSS is a hard fallback. */
    .a4-sheet--portrait-half .draft-watermark,
    .a4-sheet--portrait-half .a4-sheet-bg-watermark {
      top: 0 !important;
      bottom: auto !important;
      height: 50% !important;
    }
    .tpl-note-title {
      text-align: center !important;
      font-weight: 800 !important;
      font-size: 1.25em;
      margin: 12px 0 16px !important;
    }
    @media (max-width: 920px) {
      .contract-a4-stage {
        overflow-x: auto;
        align-items: flex-start;
        padding-inline: 8px;
      }
    }

    /* ===== HEADER ===== */
    .doc-header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 18px;
      border-bottom: 3px double #1a3c5e;
    }
    .doc-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 6px;
    }
    .doc-logo-icon {
      width: 64px; height: 64px;
      background: #1a3c5e;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #c8a84b; font-size: 28px;
      flex-shrink: 0;
    }
    /* R2 / uploaded logo: stay inside the same footprint as .doc-logo-icon */
    .doc-logo-img-wrap {
      width: 64px;
      height: 64px;
      min-width: 64px;
      max-width: 64px;
      max-height: 64px;
      padding: 4px;
      box-sizing: border-box;
      background: transparent;
      border: 1px solid #dde3ec;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .doc-logo-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .doc-company-block { text-align: right; }
    .doc-company-name { font-size: 20px; font-weight: 800; color: #1a3c5e; line-height: 1.3; }
    .doc-company-sub { font-size: 12px; color: #555; }
    .doc-contract-title {
      font-size: 20px; font-weight: 800;
      color: #1a3c5e;
      border: 2px solid #1a3c5e;
      display: inline-block;
      padding: 7px 50px;
      margin: 14px 0 6px;
      letter-spacing: 1px;
    }
    .doc-contract-meta {
      font-size: 13px; color: #444;
    }
    .doc-contract-meta span { margin: 0 8px; }

    /* Document mode: keep date / hijri / number as a slim bar, not a big header block */
    .doc-header.doc-header--meta-only {
      text-align: center;
      margin-bottom: 10px;
      padding-bottom: 0;
      border-bottom: none;
    }
    .doc-header.doc-header--meta-only .doc-logo-row {
      margin-bottom: 4px;
    }
    .doc-header.doc-header--meta-only .doc-logo-img-wrap {
      width: 40px;
      height: 40px;
      min-width: 40px;
      max-width: 40px;
      max-height: 40px;
      padding: 2px;
      border-radius: 8px;
    }
    .doc-header.doc-header--meta-only .doc-contract-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: #555;
    }
    .doc-header.doc-header--meta-only .doc-contract-meta span {
      margin: 0;
      white-space: nowrap;
    }

    /* ===== BISMILLAH ===== */
    .doc-bismillah {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #1a3c5e;
      margin: 18px 0 14px;
    }

    /* ===== INTRO PARAGRAPH ===== */
    .doc-intro {
      margin-bottom: 14px;
      text-align: justify;
    }

    /* ===== PARTIES BOX ===== */
    .doc-parties {
      border: 1.5px solid #b0b8c1;
      border-radius: 6px;
      margin: 16px 0;
      overflow: hidden;
    }
    .doc-parties-title {
      background: #1a3c5e;
      color: #fff;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
    }
    .doc-party-row {
      display: flex;
      border-bottom: 1px solid #dde3ec;
    }
    .doc-party-row:last-child { border-bottom: none; }
    .doc-party-label {
      background: transparent;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13px;
      color: #1a3c5e;
      min-width: 130px;
      display: flex; align-items: center;
      border-left: 1px solid #dde3ec;
    }
    .doc-party-value {
      padding: 10px 16px;
      font-size: 13.5px;
      flex: 1;
      line-height: 1.6;
      background: transparent;
    }

    /* ===== PREAMBLE ===== */
    .doc-preamble {
      background: transparent;
      border-right: 4px solid #c8a84b;
      padding: 14px 16px;
      margin: 18px 0;
      font-size: 13.5px;
      line-height: 1.9;
      border-radius: 0 6px 6px 0;
    }
    .doc-preamble-title {
      font-size: 14px;
      font-weight: 800;
      color: #1a3c5e;
      margin-bottom: 6px;
      text-decoration: underline;
    }

    /* ===== ARTICLES ===== */
    .doc-articles { margin: 10px 0; }
    .doc-article {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #e8ecf0;
      background: transparent;
    }
    .doc-article-title {
      font-size: 14px;
      font-weight: 800;
      color: #1a3c5e;
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px;
    }
    .doc-article-num {
      background: #1a3c5e;
      color: #fff;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0;
    }
    .doc-article-body {
      font-size: 13.5px;
      line-height: 1.6;
      padding-right: 34px;
    }
    .doc-article-body .highlight-amount {
      font-size: 16px;
      font-weight: 800;
      color: #c8a84b;
      border-bottom: 2px solid #c8a84b;
    }
    .doc-article-body .highlight-legal {
      font-weight: 700;
      color: #1a3c5e;
    }

    /* ===== NOTE BOX inside article ===== */
    .doc-note-box {
      border: 2px solid #1a3c5e;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 14px 0 4px;
      background: transparent;
      text-align: center;
    }
    .doc-note-box .note-label { font-size: 12px; color: #555; margin-bottom: 4px; }
    .doc-note-box .note-number { font-size: 22px; font-weight: 800; color: #1a3c5e; }
    .doc-note-box .note-amount { font-size: 16px; font-weight: 700; color: #c8a84b; margin-top: 4px; }
    .doc-note-box .note-words { font-size: 13px; color: #444; margin-top: 4px; }

    /* ===== FOOTER ===== */
    .doc-footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 2px solid #1a3c5e;
    }
    .doc-closing {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #1a3c5e;
      margin-bottom: 30px;
    }
    .doc-signatures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }
    .doc-sig-box { text-align: center; }
    .doc-sig-title {
      font-size: 14px; font-weight: 800;
      color: #1a3c5e; margin-bottom: 4px;
    }
    .doc-sig-name {
      font-size: 13px; color: #333; margin-bottom: 4px;
    }
    .doc-sig-detail {
      font-size: 12px; color: #666; margin-bottom: 16px;
    }
    .doc-sig-area {
      height: 90px;
      border-bottom: 1.5px solid #666;
      position: relative;
      margin-bottom: 6px;
      cursor: crosshair;
    }
    .doc-sig-area canvas {
      width: 100%; height: 100%;
    }
    .doc-sig-area-label {
      font-size: 12px; color: #888;
    }
    .doc-sig-clear {
      background: none; border: 1px solid #ddd;
      border-radius: 4px; padding: 3px 10px;
      font-size: 11px; cursor: pointer;
      margin-top: 4px; font-family: 'Tajawal', sans-serif;
      color: #888;
    }
    .doc-sig-clear:hover { border-color: #e74c3c; color: #e74c3c; }

    .doc-city-date {
      text-align: center;
      margin-top: 20px;
      font-size: 12px; color: #777;
    }

    .doc-footer,
    .doc-signatures,
    .doc-parties,
    .doc-header,
    .doc-article,
    .doc-preamble,
    .doc-note-box {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Named pages must be top-level — browsers ignore @page nested inside @media print. */
    @page portrait-page { size: A4 portrait; margin: 0; }
    @page landscape-page { size: A4 landscape; margin: 0; }
    @page { margin: 0; }

    /* ===== PRINT — match on-screen A4 sheets 1:1 ===== */
    @media print {
      .sidebar,
      .topbar,
      .contract-actions-bar,
      .contracts-page-back,
      .back-link,
      .no-print,
      .a4-page-label { display: none !important; }

      /* Do NOT lock print containers to 210mm — landscape sheets are 297mm wide and get clipped. */
      html, body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: auto !important;
        max-width: none !important;
        min-width: 0 !important;
        overflow: visible !important;
      }
      .main-content,
      .page-content,
      #contractDoc {
        margin: 0 !important;
        padding: 0 !important;
        width: auto !important;
        max-width: none !important;
        min-width: 0 !important;
        overflow: visible !important;
      }
      .page-content {
        background: #fff !important;
      }
      .contract-a4-stage {
        display: block !important;
        gap: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        border-radius: 0 !important;
        zoom: 1 !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        overflow: visible !important;
      }

      .contract-doc,
      .a4-sheet {
        box-shadow: none !important;
        border: none !important;
        width: 210mm !important;
        max-width: 210mm !important;
        height: 297mm !important;
        min-height: 297mm !important;
        max-height: 297mm !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        page: portrait-page;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .a4-sheet--landscape {
        page: landscape-page;
        width: 297mm !important;
        max-width: 297mm !important;
        min-width: 297mm !important;
        height: 210mm !important;
        min-height: 210mm !important;
        max-height: 210mm !important;
      }
      .a4-sheet:not(.has-letterhead) {
        padding: 18mm 16mm !important;
      }
      .a4-sheet.has-letterhead {
        padding: 0 !important;
      }
      .a4-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .a4-sheet-inner {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .a4-sheet--portrait-half .a4-sheet-inner {
        flex: 0 0 auto !important;
        overflow: hidden !important;
      }
      .a4-sheet.has-letterhead .a4-sheet-inner {
        padding: 6mm 16mm !important;
      }
      .a4-letterhead-header,
      .a4-letterhead-footer {
        flex: 0 0 auto !important;
        width: 100% !important;
        max-height: 80mm !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .a4-letterhead-footer {
        margin-top: auto !important;
      }
      .a4-sheet--portrait-half .a4-letterhead-footer {
        margin-top: 0 !important;
      }
      .a4-letterhead-header img,
      .a4-letterhead-footer img {
        width: 100% !important;
        max-height: 80mm !important;
        height: auto !important;
        display: block !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .a4-sheet-bg-watermark,
      .a4-sheet-bg-watermark img {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .doc-sig-clear, .no-print { display: none !important; }
      .contract-doc.is-draft::before,
      .a4-sheet.is-draft::before {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: rgba(255, 255, 255, 0.38) !important;
      }
      /*
       * position:fixed repeats on every printed page.
       * The diagonal text is embedded as an SVG background-image (set by JS in
       * fitDraftWatermark) so there is no CSS transform to trigger Chrome's
       * "transform eats the page" compositing bug.
       */
      .draft-watermark {
        position: fixed !important;
        inset: 0 !important;
        display: block !important;
        background-repeat: no-repeat !important;
        background-size: 100% 100% !important;
        background-position: center center !important;
        overflow: visible !important;
        z-index: 9999 !important;
        pointer-events: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      /* Only the first sheet's watermark draws in print (fixed repeats every page) */
      .a4-sheet:not(:first-child) .draft-watermark {
        display: none !important;
      }
      /* The HTML inner element is hidden; SVG bg image does the drawing */
      .draft-watermark__inner {
        display: none !important;
      }
    }

    /* ===== Unapproved draft — document-relative diagonal ===== */
    .contract-doc-body,
    .a4-sheet-inner {
      position: relative;
      z-index: 1; /* keep above .a4-sheet-bg-watermark (0); do not collapse to 0 */
    }
    .contract-doc.is-draft::before,
    .a4-sheet.is-draft::before {
      content: '';
      position: absolute;
      inset: 0;
      /* Keep light enough that the company logo watermark stays faintly visible */
      background: rgba(255, 255, 255, 0.28);
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .draft-watermark {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      /* background-image intentionally unset — SVG is injected into a @media print <style> tag by JS */
    }
    .draft-watermark__inner {
      text-align: center;
      font-family: 'Tajawal', sans-serif;
      font-weight: 800;
      letter-spacing: 0.04em;

  <script src="js/app.js"></script>
  <script>
    let currentContract = null;
    let currentTemplate = null;
    /** @type {{ enabled: boolean, url: string|null, opacity: number }|null} */
    let documentWatermark = null;
    /** @type {{ enabled: boolean, url: string|null, opacity: number }|null} */
    let documentHeader = null;
    /** @type {{ enabled: boolean, url: string|null, opacity: number }|null} */
    let documentFooter = null;
    let letterheadHeaderHeightPx = 0;
    let letterheadFooterHeightPx = 0;

    function isContractCompletedStatus(status) {
      const s = String(status ?? '').trim();
      return s === 'مكتمل' || s.toLowerCase() === 'completed';
    }

    function preloadImage(url) {
      return new Promise((resolve) => {
        if (!url) { resolve(null); return; }
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    function measureLetterheadHeight(img, sheetWidthPx, pageHeightPx) {
      if (!img || !img.naturalWidth) return 0;
      const raw = Math.round((img.naturalHeight / img.naturalWidth) * sheetWidthPx);
      // Cap each band so body text still has most of the page
      const maxBand = Math.max(40, Math.round(pageHeightPx * 0.28));
      return Math.min(raw, maxBand);
    }

    async function loadDocumentWatermark() {
      documentWatermark = null;
      documentHeader = null;
      documentFooter = null;
      letterheadHeaderHeightPx = 0;
      letterheadFooterHeightPx = 0;
      try {
        const params = new URLSearchParams();
        const fromQuery = typeof contractTablesTenantQuerySuffix === 'function'
          ? contractTablesTenantQuerySuffix()
          : '';
        if (fromQuery) {
          const [k, v] = fromQuery.split('=');
          if (k && v) params.set(k, decodeURIComponent(v));
        }
        const fromContract = currentContract && currentContract.tenant_id;
        if (fromContract && !params.has('tenant_id')) {
          params.set('tenant_id', String(fromContract));
        }
        if (currentContract && currentContract.template_id) {
          params.set('template_id', String(currentContract.template_id));
        }
        const qs = params.toString();
        const url = '/api/tenant/document-watermark' + (qs ? '?' + qs : '');
        const res = await fetch(url, { credentials: 'same-origin' });
        if (!res.ok) return;
        const json = await res.json();
        if (!(json && json.success && json.data)) return;
        const data = json.data;
        if (data.enabled && data.url) {
          const opacity = Number(data.opacity);
          documentWatermark = {
            enabled: true,
            url: String(data.url),
            opacity: Number.isFinite(opacity) ? Math.min(1, Math.max(0.03, opacity)) : 0.12
          };
        }
        if (data.header && data.header.enabled && data.header.url) {
          const opacity = Number(data.header.opacity);
          documentHeader = {
            enabled: true,
            url: String(data.header.url),
            opacity: Number.isFinite(opacity) ? Math.min(1, Math.max(0.1, opacity)) : 1
          };
        }
        if (data.footer && data.footer.enabled && data.footer.url) {
          const opacity = Number(data.footer.opacity);
          documentFooter = {
            enabled: true,
            url: String(data.footer.url),
            opacity: Number.isFinite(opacity) ? Math.min(1, Math.max(0.1, opacity)) : 1
          };
        }

        // Preload letterhead images and measure heights at A4 width so pagination reserves space.
        const probe = document.createElement('div');
        probe.className = 'a4-sheet';
        probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;height:297mm;';
        document.body.appendChild(probe);
        const sheetWidth = probe.offsetWidth || Math.round(210 * 3.78);
        const pageHeight = probe.clientHeight || Math.round(297 * 3.78);
        probe.remove();

        const [headerImg, footerImg] = await Promise.all([
          documentHeader ? preloadImage(documentHeader.url) : Promise.resolve(null),
          documentFooter ? preloadImage(documentFooter.url) : Promise.resolve(null)
        ]);
        letterheadHeaderHeightPx = measureLetterheadHeight(headerImg, sheetWidth, pageHeight);
        letterheadFooterHeightPx = measureLetterheadHeight(footerImg, sheetWidth, pageHeight);
      } catch (_) {
        documentWatermark = null;
        documentHeader = null;
        documentFooter = null;
      }
    }

    function appendBgWatermark(sheet) {
      if (!documentWatermark || !documentWatermark.enabled || !documentWatermark.url) return;
      sheet.style.setProperty('--doc-wm-opacity', String(documentWatermark.opacity));
      const bg = document.createElement('div');
      bg.className = 'a4-sheet-bg-watermark';
      bg.setAttribute('aria-hidden', 'true');
      const img = document.createElement('img');
      img.src = documentWatermark.url;
      img.alt = '';
      img.draggable = false;
      bg.appendChild(img);
      sheet.insertBefore(bg, sheet.firstChild);
    }

    function appendLetterheadBand(sheet, kind) {
      const cfg = kind === 'header' ? documentHeader : documentFooter;
      if (!cfg || !cfg.enabled || !cfg.url) return null;
      sheet.classList.add('has-letterhead');
      const band = document.createElement('div');
      band.className = kind === 'header' ? 'a4-letterhead-header' : 'a4-letterhead-footer';
      band.style.setProperty('--doc-letterhead-opacity', String(cfg.opacity));
      band.setAttribute('aria-hidden', 'true');
      const img = document.createElement('img');
      img.src = cfg.url;
      img.alt = '';
      img.draggable = false;
      band.appendChild(img);
      return band;
    }

    function fitDraftWatermark() {
      const sheets = document.querySelectorAll('.a4-sheet, .contract-doc');
      const targets = sheets.length
        ? sheets
        : [document.getElementById('printArea')].filter(Boolean);

      let printSvgReady = false;
      targets.forEach((doc) => {
        const watermark = doc.querySelector('.draft-watermark');
        const inner = watermark && watermark.querySelector('.draft-watermark__inner');
        if (!inner || !doc || (watermark && watermark.hidden)) return;

        const W = doc.offsetWidth || 794;
        const fullH = doc.offsetHeight || 1123;
        // If the watermark box was explicitly constrained (half-page sheets set
        // top/height inline), use its own rendered height — that's the true
        // allocated area for the diagonal. Otherwise fall back to full sheet.
        const isConstrained = watermark.dataset && watermark.dataset.wmConstrained === '1';
        const wmH = watermark.offsetHeight;
        const H = isConstrained && wmH
          ? wmH
          : Math.min(fullH, Math.round(297 * 3.78));

        const diag = Math.round(Math.sqrt(W * W + H * H));
        // Negative = counter-clockwise: top-right → bottom-left (RTL diagonal)
        const angleDeg = -(Math.atan2(H, W) * 180 / Math.PI);
        const fontSize = Math.max(40, Math.round(W * 0.12));

        // ── Screen: rotate + size the HTML element ──
        inner.style.width = diag + 'px';
        inner.style.transform = 'rotate(' + angleDeg.toFixed(1) + 'deg)';
        inner.style.fontSize = fontSize + 'px';

        if (printSvgReady) return;
        printSvgReady = true;

        // ── Print: bake rotation into an SVG background-image ──
        // A4 page (595 × 842 pt). Keep the same angle.
        const svgW = 595, svgH = 842;
        const cx = (svgW / 2).toFixed(1);
        const cy = (svgH / 2).toFixed(1);
        const svgFontSize = Math.round(svgW * 0.12);
        const svgAngle = angleDeg.toFixed(1);
        const svg =
          '<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 ' + svgW + ' ' + svgH + '\'>' +
          '<text x=\'' + cx + '\' y=\'' + cy + '\' text-anchor=\'middle\' dominant-baseline=\'middle\'' +
          ' font-family=\'Tajawal,Arial,sans-serif\' font-weight=\'800\' font-size=\'' + svgFontSize + '\'' +
          ' fill=\'rgb(40,40,40)\' fill-opacity=\'0.22\'' +
          ' transform=\'rotate(' + svgAngle + ' ' + cx + ' ' + cy + ')\'>' +
          '\u0645\u0633\u0648\u062f\u0629 \u063a\u064a\u0631 \u0645\u0639\u062a\u0645\u062f\u0629' +
          '</text></svg>';
        // Inject SVG into a @media print <style> tag so it ONLY applies during printing,
        // never on screen (avoids any inline-style vs screen-CSS specificity fights).
        let printStyle = document.getElementById('_wmPrintStyle');
        if (!printStyle) {
          printStyle = document.createElement('style');
          printStyle.id = '_wmPrintStyle';
          document.head.appendChild(printStyle);
        }
        printStyle.textContent =
          '@media print{.a4-sheet:first-child .draft-watermark,#draftWatermarkInner{background-image:url("data:image/svg+xml,' +
          encodeURIComponent(svg) + '")!important;}}';
      });
    }

    function updateDraftWatermark() {
      const stage = document.getElementById('printArea');
      if (!stage) return;
      const show = currentContract && !isContractCompletedStatus(currentContract.status);
      stage.classList.toggle('is-draft', show);
      stage.querySelectorAll('.a4-sheet, .contract-doc').forEach((sheet) => {
        sheet.classList.toggle('is-draft', show);
      });
      stage.querySelectorAll('.draft-watermark').forEach((watermark) => {
        watermark.hidden = !show;
        watermark.setAttribute('aria-hidden', show ? 'false' : 'true');
      });
      fitDraftWatermark();
    }

    /** Usable body height: real A4 probe with letterhead so packing matches the layout. */
    function getA4ContentHeightPx(orientation) {
      const isLandscape = orientation === 'landscape';
      const mmH = isLandscape ? 210 : 297;
      const holder = document.createElement('div');
      holder.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;';
      const built = createA4Sheet(false, 0, 1, null, orientation);
      built.sheet.style.height = mmH + 'mm';
      built.sheet.style.minHeight = mmH + 'mm';
      built.sheet.style.margin = '0';
      holder.appendChild(built.sheet);
      document.body.appendChild(holder);
      void built.sheet.offsetHeight;

      const pageH = built.sheet.clientHeight || Math.round(mmH * 3.78);
      const headerEl = built.sheet.querySelector('.a4-letterhead-header');
      const footerEl = built.sheet.querySelector('.a4-letterhead-footer');
      const headerH = headerEl ? headerEl.offsetHeight : 0;
      const footerH = footerEl ? footerEl.offsetHeight : 0;
      const cs = getComputedStyle(built.inner);
      const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      // Body may use the space between header and footer (padding excluded from content budget
      // because measureInnerContentHeight returns children-only height).
      const available = pageH - headerH - footerH - padY;
      holder.remove();
      return Math.max(240, available);
    }

    /**
     * Height of packed blocks only (no flex stretch, no padding).
     */
    function measureInnerContentHeight(inner) {
      if (!inner) return 0;
      const prev = {
        flex: inner.style.flex,
        height: inner.style.height,
        minHeight: inner.style.minHeight,
        overflow: inner.style.overflow
      };
      inner.style.flex = '0 0 auto';
      inner.style.height = 'auto';
      inner.style.minHeight = '0';
      inner.style.overflow = 'visible';
      const cs = getComputedStyle(inner);
      const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      const h = Math.max(0, inner.scrollHeight - padY);
      inner.style.flex = prev.flex;
      inner.style.height = prev.height;
      inner.style.minHeight = prev.minHeight;
      inner.style.overflow = prev.overflow;
      return h;
    }

    /** Turn free-text / rich document body into block lines for pagination.
     *  Rich HTML must still split on <br> — TinyMCE often stores the whole body
     *  as one <p> with <br>s; without that split the header sits alone on page 1.
     *  When splitting/unwrapping, inherit font-size/styles from parents (incl. .tpl-doc-font)
     *  so chosen document sizes survive pagination onto each .doc-a4-line. */
    function expandDocumentBodyBlocks(bodyEl) {
      const docBody = bodyEl.querySelector('.doc-document-body');
      if (!docBody) return;

      const wrap = document.createElement('div');
      wrap.className = 'doc-document-body';
      if (docBody.getAttribute('data-rich') === '1') wrap.setAttribute('data-rich', '1');
      const baseStyle = docBody.getAttribute('style');
      if (baseStyle) wrap.setAttribute('style', baseStyle);
      const rootInherit = baseStyle || '';

      function mergeStyles(...parts) {
        return parts
          .map((s) => String(s || '').trim().replace(/;+\s*$/, ''))
          .filter(Boolean)
          .join('; ');
      }

      /** If html is a single outer <span style="…">…</span>, unwrap and return its style. */
      function unwrapStyledSpan(html) {
        const m = String(html || '').match(/^\s*<span\b([^>]*)>([\s\S]*)<\/span>\s*$/i);
        if (!m) return null;
        const styleMatch = m[1].match(/\bstyle\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
        const style = styleMatch ? (styleMatch[1] || styleMatch[2] || styleMatch[3] || '') : '';
        if (!style) return null;
        return { style, inner: m[2] };
      }

      function appendLineHtml(html, inheritStyle) {
        const line = document.createElement('p');
        line.className = 'doc-a4-line';
        if (inheritStyle) line.setAttribute('style', inheritStyle);
        const trimmed = String(html || '').trim();
        line.innerHTML = trimmed ? html : '&nbsp;';
        wrap.appendChild(line);
      }

      function expandRichNode(node, parentStyle) {
        const inherited = parentStyle || '';
        if (node.nodeType === 3) {
          if (String(node.textContent || '').trim()) {
            appendLineHtml(escHtml(node.textContent), inherited);
          }
          return;
        }
        if (node.nodeType !== 1) return;
        const el = node;
        const tag = el.tagName.toUpperCase();
        const ownStyle = el.getAttribute('style') || '';
        const nextInherit = mergeStyles(inherited, ownStyle);

        // Keep atomic layout blocks (signatures / forced page breaks / note sections)
        if (
          el.classList.contains('tpl-sig-row') ||
          el.classList.contains('tpl-page-break') ||
          el.classList.contains('tpl-note-section') ||
          el.classList.contains('tpl-note-title') ||
          /page-break-before\s*:\s*always/i.test(ownStyle)
        ) {
          const clone = el.cloneNode(true);
          clone.classList.add('doc-a4-line');
          if (inherited && !String(clone.getAttribute('style') || '').includes('font-size')) {
            clone.setAttribute('style', mergeStyles(inherited, clone.getAttribute('style')));
          }
          wrap.appendChild(clone);
          return;
        }

        // Unwrap block containers so each child can paginate independently —
        // keep font-size from wrappers like .tpl-doc-font.
        if ((tag === 'DIV' || tag === 'SECTION' || tag === 'ARTICLE') && el.children.length) {
          const hasBlockChild = Array.from(el.children).some((c) =>
            /^(P|DIV|H[1-6]|UL|OL|LI|TABLE|BLOCKQUOTE|SECTION|ARTICLE)$/i.test(c.tagName)
          );
          if (hasBlockChild) {
            Array.from(el.childNodes).forEach((child) => expandRichNode(child, nextInherit));
            return;
          }
        }

        let html = el.innerHTML || '';
        let inheritStyle = nextInherit;

        // Split br-separated content (common after plain→TinyMCE conversion)
        if (/<br\s*\/?>/i.test(html)) {
          let guard = 0;
          while (guard++ < 3) {
            const unwrapped = unwrapStyledSpan(html);
            if (!unwrapped) break;
            inheritStyle = mergeStyles(inheritStyle, unwrapped.style);
            html = unwrapped.inner;
          }
          html.split(/<br\s*\/?>/i).forEach((part) => appendLineHtml(part, inheritStyle));
          return;
        }

        // Keep lists/tables/headings as single units
        if (/^(UL|OL|TABLE|H[1-6]|BLOCKQUOTE)$/i.test(tag)) {
          const clone = el.cloneNode(true);
          clone.classList.add('doc-a4-line');
          if (inherited && !String(clone.getAttribute('style') || '').includes('font-size')) {
            clone.setAttribute('style', mergeStyles(inherited, clone.getAttribute('style')));
          }
          wrap.appendChild(clone);
          return;
        }

        // Normal paragraph / inline wrapper → one line (preserves + inherits style)
        const clone = el.cloneNode(true);
        clone.classList.add('doc-a4-line');
        if (inherited) {
          clone.setAttribute('style', mergeStyles(inherited, clone.getAttribute('style')));
        }
        wrap.appendChild(clone);
      }

      if (docBody.getAttribute('data-rich') === '1') {
        Array.from(docBody.childNodes).forEach((child) => expandRichNode(child, rootInherit));
        if (!wrap.children.length) appendLineHtml('&nbsp;', rootInherit);
      } else {
        const parts = String(docBody.innerHTML || '').split(/<br\s*\/?>/i);
        parts.forEach((part) => appendLineHtml(part, rootInherit));
      }

      docBody.replaceWith(wrap);
      // Flatten so each line is a direct pagination candidate (siblings of .doc-header)
      const lines = Array.from(wrap.children);
      lines.forEach((line) => bodyEl.insertBefore(line, wrap));
      wrap.remove();
    }

    /** Unwrap .doc-articles so each article can break across pages independently. */
    function flattenArticleGroups(bodyEl) {
      bodyEl.querySelectorAll('.doc-articles').forEach((group) => {
        while (group.firstChild) {
          group.parentNode.insertBefore(group.firstChild, group);
        }
        group.remove();
      });
    }

    function createA4Sheet(isDraft, pageIndex, pageCount, docFont, orientation) {
      const isLandscape = orientation === 'landscape';
      const sheet = document.createElement('div');
      sheet.className = 'a4-sheet' + (isDraft ? ' is-draft' : '') + (isLandscape ? ' a4-sheet--landscape' : '');
      if (docFont) {
        sheet.style.setProperty('--doc-body-font-size', docFont);
        sheet.style.fontSize = docFont;
      }
      appendBgWatermark(sheet);
      const headerBand = appendLetterheadBand(sheet, 'header');
      if (headerBand) sheet.appendChild(headerBand);
      const inner = document.createElement('div');
      inner.className = 'a4-sheet-inner';
      sheet.appendChild(inner);
      const footerBand = appendLetterheadBand(sheet, 'footer');
      if (footerBand) sheet.appendChild(footerBand);
      if (isDraft) {
        const wm = document.createElement('div');
        wm.className = 'draft-watermark';
        if (pageIndex === 0) wm.id = 'draftWatermarkInner';
        wm.innerHTML = '<div class="draft-watermark__inner">مسودة غير معتمدة</div>';
        sheet.appendChild(wm);
      }
      const label = document.createElement('div');
      label.className = 'a4-page-label no-print';
      label.textContent = pageCount > 1 ? (pageIndex + 1) + ' / ' + pageCount : '';
      sheet.appendChild(label);
      return { sheet, inner, label };
    }

    /**
     * Keep a marked template section on one physical sheet. The transform is only
     * applied when the section exceeds its orientation's usable height.
     */
    function fitSheetContentToSinglePage(page, maxH) {
      const inner = page?.inner;
      if (!inner || !maxH) return;

      inner.style.transform = '';
      inner.style.transformOrigin = '';
      inner.style.width = '';

      const initialH = measureInnerContentHeight(inner);
      if (initialH <= maxH + 2) return;

      let scale = Math.min(1, (maxH - 2) / initialH);
      // Compensating the width changes wrapping, so converge on the final scale.
      for (let i = 0; i < 5; i++) {
        inner.style.width = `${100 / scale}%`;
        const rawH = measureInnerContentHeight(inner);
        const nextScale = Math.min(1, (maxH - 2) / Math.max(1, rawH));
        if (Math.abs(nextScale - scale) < 0.002) {
          scale = nextScale;
          break;
        }
        scale = nextScale;
      }

      inner.style.width = `${100 / scale}%`;
      inner.style.transformOrigin = 'top right';
      inner.style.transform = `scale(${scale})`;
      inner.dataset.sectionFitScale = scale.toFixed(3);
    }

    /**
     * Split the rendered contract into stacked A4 sheets for on-screen preview.
     * Print uses the same sheets with page-break-after.
     */
    function paginateContractToA4() {
      const host = document.getElementById('contractDoc');
      const source = document.getElementById('printArea');
      if (!host || !source || source.classList.contains('contract-a4-stage')) return;

      const bodyEl = source.querySelector('.contract-doc-body');
      if (!bodyEl) return;

      const docFont = (source.style.getPropertyValue('--doc-body-font-size') || '').trim()
        || detectTemplateFontSize(source.querySelector('.doc-document-body')?.getAttribute('style') || '')
        || '12px';

      const isDraft = source.classList.contains('is-draft');
      expandDocumentBodyBlocks(bodyEl);
      flattenArticleGroups(bodyEl);

      const blocks = Array.from(bodyEl.children);
      if (!blocks.length) return;
      // Service templates with fixed sections: one portrait contract sheet, then a second sheet.
      // tpl-page-break--landscape → landscape second sheet (legacy).
      // tpl-page-break--portrait-half → portrait second sheet, content scaled to top half only.
      const enforceSinglePageSections = blocks.some((block) =>
        block.classList?.contains('tpl-page-break--landscape') ||
        block.classList?.contains('tpl-page-break--portrait-half')
      );

      const maxHPortrait = getA4ContentHeightPx('portrait');
      const maxHLandscape = getA4ContentHeightPx('landscape');
      const stage = document.createElement('div');
      stage.className = 'contract-a4-stage' + (isDraft ? ' is-draft' : '');
      stage.id = 'printArea';
      stage.style.setProperty('--doc-body-font-size', docFont);

      // Attach stage before measuring so layout metrics are real
      host.insertBefore(stage, source);

      const pages = [];
      let currentOrientation = 'portrait';
      let current = createA4Sheet(isDraft, 0, 1, docFont, 'portrait');
      pages.push(current);
      stage.appendChild(current.sheet);
      let nextSectionIsHalf = false;

      blocks.forEach((block) => {
        const isLandscapeBreak = block.classList?.contains('tpl-page-break--landscape');
        const isPortraitHalfBreak = block.classList?.contains('tpl-page-break--portrait-half');
        const forceBreak =
          block.classList?.contains('tpl-page-break') ||
          /page-break-before\s*:\s*always/i.test(block.getAttribute?.('style') || '');

        if (forceBreak) {
          const nextOrientation = isLandscapeBreak ? 'landscape' : currentOrientation;
          if (isPortraitHalfBreak) nextSectionIsHalf = true;
          if (current.inner.children.length > 0) {
            if (enforceSinglePageSections) {
              const currentMaxH = current.isHalf ? maxHPortrait / 2
                : currentOrientation === 'landscape' ? maxHLandscape : maxHPortrait;
              fitSheetContentToSinglePage(current, currentMaxH);
            }
            // Close current page and open a new one with the target orientation.
            currentOrientation = nextOrientation;
            current = createA4Sheet(isDraft, pages.length, 1, docFont, currentOrientation);
            current.isHalf = nextSectionIsHalf;
            if (nextSectionIsHalf) current.sheet.classList.add('a4-sheet--portrait-half');
            nextSectionIsHalf = false;
            pages.push(current);
            stage.appendChild(current.sheet);
          } else if (nextOrientation !== currentOrientation) {
            // Current page is empty — switch its orientation in-place instead of adding a blank sheet.
            current.sheet.classList.add('a4-sheet--landscape');
            currentOrientation = nextOrientation;
          }
          return;
        }

        const maxH = currentOrientation === 'landscape' ? maxHLandscape : maxHPortrait;
        current.inner.appendChild(block);
        if (enforceSinglePageSections) return;

        const overflows = measureInnerContentHeight(current.inner) > maxH + 2 && current.inner.children.length > 1;
        if (!overflows) return;

        // Never open a new page above the signature block — keep الختم/التوقيع under the body.
        // Slight overflow is clipped by the sheet; compact inline labels keep this within 2 pages.
        if (block.classList?.contains('tpl-sig-row')) {
          return;
        }

        current.inner.removeChild(block);
        current = createA4Sheet(isDraft, pages.length, 1, docFont, currentOrientation);
        pages.push(current);
        stage.appendChild(current.sheet);
        current.inner.appendChild(block);
      });

      if (enforceSinglePageSections) {
        const halfBudget = Math.round(maxHPortrait * 0.45);
        if (current.isHalf && current.inner) {
          // Fit the note section by actual font-size scaling (not transform).
          // transform:scale doesn't shrink DOM layout — combined with overflow
          // hidden it was clipping real lines. Reducing font-size changes true
          // layout, so content actually fits and no lines are lost.
          const noteSection = current.inner.querySelector('.tpl-note-section');
          if (noteSection) {
            const naturalH = noteSection.offsetHeight;
            if (naturalH > halfBudget) {
              const scale = halfBudget / naturalH;
              const bodyFS = parseFloat(getComputedStyle(noteSection).fontSize) || 20;
              noteSection.style.fontSize = (bodyFS * scale).toFixed(2) + 'px';
              const title = noteSection.querySelector('.tpl-note-title');
              if (title) {
                const titleFS = parseFloat(getComputedStyle(title).fontSize) || 28;
                title.style.fontSize = (titleFS * scale).toFixed(2) + 'px';
              }
            }
          }
          // Constrain the draft watermark to the inner's rect explicitly.
          // Moving it into inner via inset:0 was unreliable — inline top/height
          // wins over any CSS and forces the diagonal to center on the note
          // area, not the full sheet.
          const sheetRect = current.sheet.getBoundingClientRect();
          const innerRect = current.inner.getBoundingClientRect();
          const topPx = Math.max(0, Math.round(innerRect.top - sheetRect.top));
          const heightPx = Math.max(1, Math.round(innerRect.height));
          const constrainWm = (wm) => {
            if (!wm) return;
            wm.style.setProperty('top', topPx + 'px', 'important');
            wm.style.setProperty('bottom', 'auto', 'important');
            wm.style.setProperty('left', '0', 'important');
            wm.style.setProperty('right', '0', 'important');
            wm.style.setProperty('height', heightPx + 'px', 'important');
            wm.dataset.wmConstrained = '1';
          };
          constrainWm(current.sheet.querySelector('.draft-watermark'));
          constrainWm(current.sheet.querySelector('.a4-sheet-bg-watermark'));
        } else {
          const currentMaxH = currentOrientation === 'landscape' ? maxHLandscape : maxHPortrait;
          fitSheetContentToSinglePage(current, currentMaxH);
        }
      }

      const pageCount = pages.length;
      pages.forEach((p, i) => {
        if (p.label) p.label.textContent = pageCount > 1 ? (i + 1) + ' / ' + pageCount : '';
      });

      source.remove();
    }

    function afterContractRendered() {
      // Stamp before pagination so A4 height measurement includes الختم (avoids clipping).
      applyPartyOneStampIfCompleted();
      paginateContractToA4();

      const stage = document.getElementById('printArea');
      if (stage && stage.classList.contains('contract-a4-stage')) {
        stage.classList.add('a4-preview-scaled');
        // Firefox fallback (no zoom): reserve layout space for the visual scale
        if (!('zoom' in document.documentElement.style)) {
          stage.style.marginBottom = Math.round(stage.offsetHeight * 0.25) + 'px';
        }
      }
      initSignaturePads();
      configureApprovalActions();
      updateDraftWatermark();
      requestAnimationFrame(fitDraftWatermark);
      if (getParam('print') === '1') setTimeout(printPage, 1200);

    async function loadContract() {
      const id = getParam('id');
      if (!id) { window.location.href = 'contracts.html'; return; }
      try {
        currentContract = await API.getOne('contracts', id);
        currentTemplate = null;
        if (currentContract.template_id) {
          try {
            currentTemplate = await API.getOne('templates', currentContract.template_id);
          } catch (_) {
            // Template deleted/inaccessible → fall back to the structured layout below.
            currentTemplate = null;
          }
        }
        document.getElementById('topbarTitle').innerHTML =
          `<i class="fas fa-file-contract"></i> ${currentContract.contract_number || 'عرض العقد'}`;
        renderStatusDisplay(currentContract.status);
        if (currentContract.note_order_number) {
          const nl = document.getElementById('noteLink');
          nl.href = `notes.html?search=${currentContract.note_order_number}`;
          nl.style.display = 'inline-flex';
        }
        renderContractDoc(currentContract);
        await loadDocumentWatermark();
        afterContractRendered();

        document.getElementById('contractDoc').innerHTML =
          `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>خطأ في تحميل العقد</p></div>`;
      }

    // ======= RENDER — Word-style =======
    function escHtml(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /** Legacy plain-text bodies vs TinyMCE/HTML bodies. Untouched DB rows stay plain. */
    function isRichHtmlTemplate(body) {
      return /<(?:p|div|span|strong|b|em|i|u|br|ul|ol|li|h[1-6]|table|tr|td|th|a)\b/i.test(String(body || ''));
    }

    function sanitizeTemplateHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = String(html || '');
      tmp.querySelectorAll('script,iframe,object,embed,link,meta').forEach((el) => el.remove());
      tmp.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((attr) => {
          const n = attr.name;
          const v = attr.value || '';
          if (/^on/i.test(n) || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(v))) {
            el.removeAttribute(n);
          }
        });
      });
      return tmp.innerHTML;
    }

    function isDocumentModeTemplate(t) {
      return !!(t && t.render_mode === 'document' && String(t.body_content || '').trim());
    }

    /** Grouped number with no unit (template text already writes "ريال" after the value). */
    function formatPlainNumber(v) {
      if (v == null || v === '' || isNaN(Number(v))) return '';
      return Number(v).toLocaleString('en-US');
    }

    function buildTemplateSubstitutions(c) {
      const hijriDate = getHijriFromGregorian(c.date_gregorian) || c.date_hijri || '';
      const dayName = getDayName(c.date_gregorian) || '';
      return {
        party_two_name: c.party_two_name || '',
        party_two_id: c.party_two_id || '',
        party_two_phone: c.party_two_phone || '',
        party_two_address: c.party_two_address || '',
        date_gregorian: c.date_gregorian || '',
        date_hijri: hijriDate,
        day_name: dayName,
        finance_type: c.finance_type || '',
        finance_amount: formatPlainNumber(c.finance_amount),
        commission_amount: formatPlainNumber(c.commission_amount),
        commission_amount_words: numberToArabicWords(c.commission_amount),
        property_description: c.property_description || '',
        property_location: c.property_location || '',
        note_order_number: c.note_order_number || '',
        contract_number: c.contract_number || '',
        bank_name: c.bank_name || ''
      };
    }

    /**
     * Substitute {{vars}} into the body.
     * Plain-text (legacy): escape all + newlines → <br> (unchanged behavior).
     * Rich HTML: escape only substituted values, then sanitize tags.
     */
    function fillTemplateBody(body, map) {
      const raw = String(body || '');
      const rich = isRichHtmlTemplate(raw);
      const replaced = raw.replace(/\{\{\s*(\w+)\s*\}\}/g, (m, key) => {
        if (!Object.prototype.hasOwnProperty.call(map, key)) return m;
        return rich ? escHtml(map[key]) : String(map[key]);
      });
      if (rich) return sanitizeTemplateHtml(replaced);
      return escHtml(replaced).replace(/\r\n|\r|\n/g, '<br>');
    }

    function detectTemplateFontSize(body) {
      const raw = String(body || '');
      let m = raw.match(/class=["'][^"']*tpl-doc-font[^"']*["'][^>]*style=["'][^"']*font-size\s*:\s*([\d.]+px)/i)
        || raw.match(/style=["'][^"']*font-size\s*:\s*([\d.]+px)[^"']*["'][^>]*class=["'][^"']*tpl-doc-font/i)
        || raw.match(/font-size\s*:\s*([\d.]+px)/i);
      return m ? m[1] : '12px';
    }

              ${c.property_location ? `الموقع: <strong>${c.property_location}</strong>` : ''}
            </div>
          </div>` : ''}

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="doc-footer">
          <div class="doc-closing">والله ولي التوفيق</div>

          <div class="doc-signatures">
            <!-- Party One -->
            <div class="doc-sig-box">
              <div class="doc-sig-title">الطرف الأول</div>
              <div class="doc-sig-name">شركة الموعد للمقاولات العامة</div>
              <div class="doc-sig-detail">س.ت: 3350140062 | الرياض</div>
              <div class="doc-sig-area">
                <canvas id="sig1Canvas"></canvas>
              </div>
              <div class="doc-sig-area-label">التوقيع والختم</div>
              <button class="doc-sig-clear no-print" onclick="clearCanvas('sig1Canvas')">
                <i class="fas fa-eraser"></i> مسح
              </button>
            </div>

            <!-- Party Two -->
            <div class="doc-sig-box">
              <div class="doc-sig-title">الطرف الثاني</div>
              <div class="doc-sig-name">${c.party_two_name || '—'}</div>
              <div class="doc-sig-detail">هوية: ${c.party_two_id || '—'}</div>
              <div class="doc-sig-area">
                <canvas id="sig2Canvas"></canvas>
              </div>
              <div class="doc-sig-area-label">التوقيع</div>
              <button class="doc-sig-clear no-print" onclick="clearCanvas('sig2Canvas')">
                <i class="fas fa-eraser"></i> مسح
              </button>
            </div>
          </div>

          <div class="doc-city-date">
            حُرِّر في مدينة الرياض بتاريخ ${c.date_gregorian || '——/——/——'} م
            الموافق ${hijriDate || '——/——/——'} هـ
          </div>
        </div>

        </div><!-- /contract-doc-body -->

        <div id="draftWatermarkInner" class="draft-watermark"${isDraft ? '' : ' hidden aria-hidden="true"'}>
          <div class="draft-watermark__inner">مسودة غير معتمدة</div>
        </div>

      </div><!-- /contract-doc -->
      `;
    }

    // ======= HELPERS =======
    function getDayName(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('ar-SA', { weekday: 'long' });
      } catch { return '—'; }
    }

    function getHijriFromGregorian(dateStr) {
      if (!dateStr) return '';
      try {
        const [year, month, day] = String(dateStr).split('-').map(Number);
        if (!year || !month || !day) return '';
        const gregorianDate = new Date(year, month - 1, day, 12, 0, 0);
        if (Number.isNaN(gregorianDate.getTime())) return '';
        return gregorianDate.toLocaleDateString('ar-SA-u-ca-islamic', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });
      } catch (_) {
        return '';
      }
    }

    // ======= SIGNATURE PADS =======
    function initSignaturePads() {
      ['sig1Canvas', 'sig2Canvas'].forEach(id => {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        const parent = canvas.parentElement;
        canvas.width = parent.offsetWidth || 280;
        canvas.height = 86;
        const ctx = canvas.getContext('2d');
        let drawing = false, lx = 0, ly = 0;

        const getPos = (e) => {
          const r = canvas.getBoundingClientRect();
          const cx = (e.touches ? e.touches[0].clientX : e.clientX);
          const cy = (e.touches ? e.touches[0].clientY : e.clientY);
          return [cx - r.left, cy - r.top];
        };

        canvas.addEventListener('mousedown', e => { drawing = true; [lx,ly] = getPos(e); });
        canvas.addEventListener('mousemove', e => {
          if (!drawing) return;
          const [x,y] = getPos(e);
          ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y);
          ctx.strokeStyle = '#1a3c5e'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
          [lx,ly] = [x,y];
        });
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mouseleave', () => drawing = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; [lx,ly] = getPos(e); }, {passive:false});
        canvas.addEventListener('touchmove', e => {
          e.preventDefault(); if (!drawing) return;
          const [x,y] = getPos(e);
          ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y);
          ctx.strokeStyle = '#1a3c5e'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
          [lx,ly] = [x,y];
        }, {passive:false});
        canvas.addEventListener('touchend', () => drawing = false);
      });
    }

    function clearCanvas(id) {
      const c = document.getElementById(id);
      if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
    }

    // ======= ACTIONS =======
    function renderStatusDisplay(status) {
      const el = document.getElementById('statusDisplay');
      if (!el) return;
      el.innerHTML = getStatusBadge(status || 'نشط');
    }

    function isContractPendingApprovalForCurrentRole() {
      const roleId = getContractsRoleId();
      if (!currentContract) return false;
      if (roleId === 5) return currentContract.status === CONTRACT_STATUS_AWAITING_BANK_AGENT_APPROVAL;
      if (roleId === 1 || roleId === 2) return currentContract.status === CONTRACT_STATUS_AWAITING_ADMIN_APPROVAL;
      return false;
    }

    function configureApprovalActions() {
      const approveBtn = document.getElementById('approveContractBtn');
      if (!approveBtn || !currentContract) return;
      const roleId = getContractsRoleId();
      renderStatusDisplay(currentContract.status);
      approveBtn.style.display = isContractPendingApprovalForCurrentRole() ? 'inline-flex' : 'none';

      if ((roleId === 1 || roleId === 2) && currentContract.status === CONTRACT_STATUS_AWAITING_ADMIN_APPROVAL) {
        approveBtn.innerHTML = '<i class="fas fa-check-circle"></i> اعتماد نهائي';
      } else if (roleId === 5 && currentContract.status === CONTRACT_STATUS_AWAITING_BANK_AGENT_APPROVAL) {
        approveBtn.innerHTML = '<i class="fas fa-check-circle"></i> اعتماد وإرسال للإدارة';
      }
    }

    function editContract() {
      window.location.href = `new-contract.html?edit=${currentContract.id}`;
    }

    function sendContractWhatsApp() {
      if (!currentContract || !currentContract.party_two_phone) {
        showToast('رقم الجوال غير متوفر', 'warning'); return;
      }
      const msg =
`السلام عليكم ${currentContract.party_two_name}،

نود إحاطتكم علماً بأنه تم إعداد ${currentContract.template_name || 'عقد الوساطة العقارية'} رقم (${currentContract.contract_number}).

📋 تفاصيل العقد:
• نوع التمويل: ${currentContract.finance_type}
• مبلغ التمويل: ${formatMoney(currentContract.finance_amount)}
• قيمة السعي: ${formatMoney(currentContract.commission_amount)}
• رقم سند الأمر: ${currentContract.note_order_number}

⚠️ تنبيه: لن يُستحق مبلغ السعي إلا بعد نزول التمويل في حسابكم مباشرةً.

للتواصل والاستفسار:
شركة الموعد للمقاولات العامة
📞 920012979`;
      sendWhatsApp(currentContract.party_two_phone, msg);
    }

    async function approveContract() {
      if (!currentContract) return;
      const roleId = getContractsRoleId();
      let newStatus = null;
      if (roleId === 5 && currentContract.status === CONTRACT_STATUS_AWAITING_BANK_AGENT_APPROVAL) {
        newStatus = CONTRACT_STATUS_AWAITING_ADMIN_APPROVAL;
      } else if ((roleId === 1 || roleId === 2) && currentContract.status === CONTRACT_STATUS_AWAITING_ADMIN_APPROVAL) {
        newStatus = 'نشط';
      }
      if (!newStatus) return;
      try {
        const updated = await API.patch('contracts', currentContract.id, { status: newStatus });
        currentContract = updated || { ...currentContract, status: newStatus };
        configureApprovalActions();
        refreshContractDocumentView();
        showToast('تم اعتماد العقد بنجاح', 'success');
      } catch (e) {
        showToast('خطأ في اعتماد العقد', 'error');
      }
    }

    async function archiveContract() {
      if (!confirm('هل تريد أرشفة هذا العقد بعد اكتمال معاملاته؟\n\nسيتم نقله للأرشيف ويمكن استرجاعه لاحقاً.')) return;
      try {
        await API.patch('contracts', currentContract.id, { status: 'مؤرشف', is_archived: true });
        showToast('تم أرشفة العقد بنجاح', 'success');
        setTimeout(() => window.location.href = 'contracts.html', 1500);
      } catch (e) { showToast('خطأ في الأرشفة', 'error'); }
    }

    document.addEventListener('DOMContentLoaded', loadContract);
    window.addEventListener('resize', fitDraftWatermark);

    /** Expand print ancestors so 297mm landscape sheets are not clipped to portrait width. */
    function prepareMixedOrientationPrint() {
      const nodes = [
        document.documentElement,
        document.body,
        document.querySelector('.main-content'),
        document.querySelector('.page-content'),
        document.getElementById('contractDoc'),
        document.getElementById('printArea')
      ].filter(Boolean);
      nodes.forEach((el) => {
        el.dataset.printWidthPrev = el.style.width || '';
        el.dataset.printMaxWidthPrev = el.style.maxWidth || '';
        el.dataset.printOverflowPrev = el.style.overflow || '';
        el.dataset.printOverflowXPrev = el.style.overflowX || '';
        el.style.setProperty('width', 'auto', 'important');
        el.style.setProperty('max-width', 'none', 'important');
        el.style.setProperty('overflow', 'visible', 'important');
        el.style.setProperty('overflow-x', 'visible', 'important');
      });
      document.documentElement.classList.add('printing-mixed-a4');
    }

    function restoreMixedOrientationPrint() {
      const nodes = [
        document.documentElement,
        document.body,
        document.querySelector('.main-content'),
        document.querySelector('.page-content'),
        document.getElementById('contractDoc'),
        document.getElementById('printArea')
      ].filter(Boolean);
      nodes.forEach((el) => {
        el.style.width = el.dataset.printWidthPrev || '';
        el.style.maxWidth = el.dataset.printMaxWidthPrev || '';
        el.style.overflow = el.dataset.printOverflowPrev || '';
        el.style.overflowX = el.dataset.printOverflowXPrev || '';
        delete el.dataset.printWidthPrev;
        delete el.dataset.printMaxWidthPrev;
        delete el.dataset.printOverflowPrev;
        delete el.dataset.printOverflowXPrev;
      });
      document.documentElement.classList.remove('printing-mixed-a4');
    }

    function printPage() {
      const mixed = !!document.querySelector('.a4-sheet--landscape');
      if (mixed) prepareMixedOrientationPrint();
      const cleanup = () => {
        if (mixed) restoreMixedOrientationPrint();
        window.removeEventListener('afterprint', cleanup);
      };
      window.addEventListener('afterprint', cleanup);
      window.print();
      // Safari / some WebViews never fire afterprint
      setTimeout(cleanup, 2000);
    }
    window.addEventListener('beforeprint', () => {
      requestAnimationFrame(fitDraftWatermark);
    });
  </script>
